<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
        />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>Document</title>
    </head>
    <body>
        <form
            method="post"
            action="{{ '/edit/' ~ city_id if city_id else '/add' }}"
        >
            <label for="name">City name</label>
            <input
                id="name"
                name="name"
                value="{{ name }}"
                maxlength="35"
                required
            />
            <p><b>Warning! Changes made here will affect the database.</b></p>
            <p><button type="submit">Save city</button></p>
        </form>
        <!-- If existing city, add delete button-->
        {% if city_id %}
        <form method="post" action="/delete/{{ city_id }}">
            <button type="submit">Delete city</button>
        </form>
        {% endif %}
        <p><a href="/">Home</a></p>
    </body>
</html>
